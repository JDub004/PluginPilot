# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trauerfall-lotse
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LOG_ANALYTICS
        value: "on"
      - key: MAX_BODY_BYTES
        value: "65536"
      # Operator details for /privacy, /terms, /imprint (set in the Render dashboard)
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_ADDRESS
        sync: false
      - key: OPERATOR_COUNTRY
        value: "Germany"
      - key: CONTACT_EMAIL
        sync: false
      # Token from the OpenAI plugin portal (domain verification)
      - key: OPENAI_APPS_CHALLENGE
        sync: false
