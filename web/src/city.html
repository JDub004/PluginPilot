<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software-Stadt</title>
<style>
  /* Holo-City: a night town floating on a light grid. Neon edges, glass prisms, cockpit typography. Always dark by design. */
  :root {
    --bg:#060816; --bg-2:#120b30; --panel:rgba(10,14,36,.78); --line:rgba(120,200,255,.22); --line-2:rgba(120,200,255,.5);
    --ink:#e8f1ff; --muted:#8c99c4; --cyan:#3df5ff; --mag:#ff3dbb; --accent:#3dffa8; --warn:#ffb020; --bad:#ff3d6e;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --font: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--font); }
  .stage { position:relative; width:100%; height:560px; overflow:hidden; border-radius:4px; background:radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%); touch-action:none; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  .glass { background:var(--panel); border:1px solid var(--line); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .hud { position:absolute; left:12px; top:12px; right:12px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
  .chip { pointer-events:auto; padding:6px 12px 6px 14px; display:flex; flex-direction:column; min-width:96px; box-shadow:inset 2px 0 0 var(--cyan);
          clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); }
  .chip b { font:600 17px/1.1 var(--mono); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .chip small { font:500 9.5px/1.2 var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.14em; margin-top:3px; }
  .chip.money { box-shadow:inset 2px 0 0 var(--accent); } .chip.money b { color:var(--accent); text-shadow:0 0 12px rgba(61,255,168,.45); }
  .chip.health { box-shadow:inset 2px 0 0 var(--mag); }
  .zoom { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
  .zoom button { font:600 16px var(--mono); width:36px; height:36px; color:var(--cyan); cursor:pointer; border-radius:2px; }
  .zoom button:hover, .tabs button:hover { border-color:var(--line-2); }
  .zoom button:focus-visible, .tabs button:focus-visible, .quest:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .panel { position:absolute; left:12px; bottom:12px; width:min(300px, calc(100% - 72px)); max-height:calc(100% - 84px); overflow:auto; padding:14px 16px; border-radius:2px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  /* corner brackets that stay put while the panel scrolls */
  .panel { background-image:linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan));
           background-size:14px 1.5px,1.5px 14px,14px 1.5px,1.5px 14px; background-position:0 0,0 0,100% 100%,100% 100%; background-repeat:no-repeat; }
  .kicker { font:500 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); margin:0 0 4px; }
  .panel h2 { margin:0 0 2px; font:600 18px/1.2 var(--font); letter-spacing:.01em; display:flex; align-items:center; gap:8px; }
  .gem { width:10px; height:10px; transform:rotate(45deg); background:var(--accent); box-shadow:0 0 10px var(--accent); flex:none; }
  .gem.warn { background:var(--warn); box-shadow:0 0 10px var(--warn); } .gem.bad { background:var(--bad); box-shadow:0 0 10px var(--bad); }
  .sub { color:var(--muted); margin:0 0 12px; font-size:12.5px; }
  .needs { display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; margin-bottom:12px; }
  .needs label, .needs > span { font:500 10px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
  .bar { height:6px; background:rgba(120,200,255,.1); overflow:hidden; }
  .bar i { display:block; height:100%; -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px); mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px); }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12.5px; margin:0 0 10px; padding:8px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .facts dt { color:var(--muted); font:500 10px/1.9 var(--mono); text-transform:uppercase; letter-spacing:.1em; } .facts dd { margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .section { display:block; font:500 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:6px 0 2px; }
  .quest { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:rgba(120,200,255,.04); border:0; border-left:2px solid var(--warn); padding:7px 10px; margin:6px 0; cursor:pointer; }
  .quest.high { border-left-color:var(--bad); } .quest.low { border-left-color:var(--accent); }
  .quest:hover { background:rgba(120,200,255,.1); }
  .quest b { display:block; font-size:13px; font-weight:600; }
  .quest span { font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .quest .save { color:var(--accent); font:600 11px var(--mono); letter-spacing:.04em; }
  .back { border-left-color:transparent !important; background:transparent; font:500 10px var(--mono) !important; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan) !important; padding-left:0 !important; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs button { background:transparent; border:1px solid var(--line); height:28px; padding:0 10px; font:500 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink); cursor:pointer; border-radius:2px; }
  .tabs button[aria-pressed="true"] { background:var(--cyan); color:#04121a; border-color:var(--cyan); box-shadow:0 0 14px rgba(61,245,255,.35); }
  .foot { font-size:10.5px; color:var(--muted); margin-top:10px; opacity:.8; }
  .empty { padding:24px; color:var(--muted); font:500 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; }
  @media (max-width: 520px) { .stage { height:720px; } .panel { width:calc(100% - 24px); max-height:40%; } .zoom { bottom:auto; top:140px; } .chip { min-width:0; padding:4px 10px; } .chip b { font-size:14px; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Software-Stadt: Abteilungen als Viertel, Programme als Gebäude"></canvas>
  <div class="hud" id="hud"></div>
  <div class="zoom"><button class="glass" id="zin" type="button" aria-label="Hineinzoomen">+</button><button class="glass" id="zout" type="button" aria-label="Herauszoomen">−</button><button class="glass" id="zfit" type="button" aria-label="Ganze Stadt zeigen">⌂</button></div>
  <div class="panel glass" id="panel"><div class="empty">Stadt wird gebaut …</div></div>
</div>
<script>
(function () {
  // Neon hue per category (edges, windows, glow).
  var COLORS = { crm:'#4da3ff', erp:'#9d7bff', accounting:'#2ef2c4', hr:'#ff6ad5', communication:'#ffb547', collaboration:'#3df5ff', storage:'#8fb3ff',
    spreadsheet:'#7dff6a', dev:'#6f7dff', marketing:'#ff7a59', support:'#ffe14d', security:'#b8c4ff', analytics:'#c77dff', ecommerce:'#ff4f8b', other:'#9aa5c8' };
  var LABEL = { crm:'CRM', erp:'ERP', accounting:'Buchhaltung', hr:'Personal', communication:'Kommunikation', collaboration:'Zusammenarbeit', storage:'Dateiablage',
    spreadsheet:'Tabelle', dev:'Entwicklung', marketing:'Marketing', support:'Kundenservice', security:'Sicherheit', analytics:'Auswertung', ecommerce:'Onlineshop', other:'Sonstiges' };
  var TW = 64, TH = 32, FLOOR = 13;
  var stage = document.getElementById('stage'), canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud'), panel = document.getElementById('panel');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var city = null, view = { x: 0, y: 0, s: 1 }, selected = null, tab = 'quests', t0 = performance.now(), dpr = 1;

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function iso(gx, gy) { return { x: (gx - gy) * TW / 2, y: (gx + gy) * TH / 2 }; }
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function c(v) { return Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))); }
    return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
  }
  function rgba(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function hash(a, b) { var h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }
  function el(tag, cls, kids) { var n = document.createElement(tag); if (cls) n.className = cls; (kids || []).forEach(function (k) { if (k != null) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); }); return n; }
  function eur(n) { return Math.round(n || 0).toLocaleString('de-DE') + ' €'; }
  function questsOf(b) { return city.quests.filter(function (q) { return b.questIds.indexOf(q.id) >= 0; }); }
  function mood(b) { var qs = questsOf(b); if (qs.some(function (q) { return q.severity === 'high'; })) return 'bad'; return qs.length ? 'warn' : 'ok'; }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var r = stage.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  function fit() {
    if (!city) return;
    var xs = [], ys = [];
    city.districts.forEach(function (d) { [[d.gx, d.gy], [d.gx + d.w, d.gy], [d.gx, d.gy + d.h], [d.gx + d.w, d.gy + d.h]].forEach(function (p) { var q = iso(p[0], p[1]); xs.push(q.x); ys.push(q.y); }); });
    var minX = Math.min.apply(null, xs) - TW - 120, maxX = Math.max.apply(null, xs) + TW, minY = Math.min.apply(null, ys) - 220, maxY = Math.max.apply(null, ys) + TH * 2;
    var w = canvas.width / dpr, h = canvas.height / dpr, narrow = w <= 640, off = narrow ? 0 : 320;
    // Usable area: right of the panel on wide screens, between the HUD and the panel on phones.
    var top = narrow ? 120 : 40, bottom = narrow ? h * 0.58 : h;
    w -= off;
    view.s = Math.min(1.6, Math.max(0.3, Math.min(w / (maxX - minX), (bottom - top) / (maxY - minY))));
    view.x = off + w / 2 - (minX + maxX) / 2 * view.s;
    view.y = top + (bottom - top) / 2 - (minY + maxY) / 2 * view.s;
  }

  // ---- drawing -----------------------------------------------------------------------------
  function diamond(gx, gy, w, h) {
    var a = iso(gx, gy), b = iso(gx + w, gy), c = iso(gx + w, gy + h), d = iso(gx, gy + h);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
  }
  function crystal(gx, gy, seed) {
    var p = iso(gx + 0.5, gy + 0.5), hgt = 10 + seed * 14, col = seed > 0.9 ? '#ff3dbb' : seed > 0.85 ? '#9d7bff' : '#3df5ff';
    ctx.fillStyle = rgba(col, 0.12); ctx.beginPath(); ctx.ellipse(p.x, p.y, 9, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(col, 0.28); ctx.strokeStyle = rgba(col, 0.85); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x, p.y - hgt); ctx.lineTo(p.x + 4, p.y - 2); ctx.lineTo(p.x, p.y + 1); ctx.lineTo(p.x - 4, p.y - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  function core(cx, cy, t) {
    var pulse = reduce ? 0.5 : (Math.sin(t / 700) + 1) / 2;
    for (var k = 3; k >= 1; k--) { ctx.strokeStyle = rgba('#3df5ff', 0.15 + 0.12 * (3 - k) + pulse * 0.1); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(cx, cy, 10 * k + pulse * 4, 5 * k + pulse * 2, 0, 0, Math.PI * 2); ctx.stroke(); }
    var g = ctx.createLinearGradient(cx, cy, cx, cy - 90); g.addColorStop(0, 'rgba(61,245,255,.55)'); g.addColorStop(1, 'rgba(61,245,255,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 3, cy - 90, 6, 90);
    ctx.fillStyle = '#e8ffff'; ctx.shadowColor = '#3df5ff'; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(cx, cy - 4, 4 + pulse * 1.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }
  function building(b, t) {
    var col = COLORS[b.category] || COLORS.other, hgt = b.floors * FLOOR, sel = selected === b.id;
    var c = iso(b.gx + 0.5, b.gy + 0.5), hw = TW * 0.36, hh = TH * 0.36;
    var top = { x: c.x, y: c.y - hh - hgt }, left = { x: c.x - hw, y: c.y - hgt }, right = { x: c.x + hw, y: c.y - hgt }, front = { x: c.x, y: c.y + hh - hgt };
    var m = mood(b), sc = m === 'bad' ? css('--bad') : m === 'warn' ? css('--warn') : css('--accent');
    // ground glow + rotating status ring
    var gg = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, hw * 1.6); gg.addColorStop(0, rgba(col, 0.35)); gg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(c.x, c.y, hw * 1.6, hh * 1.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.strokeStyle = sc; ctx.lineWidth = 1.6; ctx.shadowColor = sc; ctx.shadowBlur = 8;
    ctx.setLineDash([7, 5]); ctx.lineDashOffset = reduce ? 0 : -t / 45;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, hw * 1.3, hh * 1.3, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    if (m === 'bad') { var bg = ctx.createLinearGradient(c.x, c.y, c.x, top.y - 70); bg.addColorStop(0, rgba('#ff3d6e', 0.0)); bg.addColorStop(0.5, rgba('#ff3d6e', 0.22)); bg.addColorStop(1, rgba('#ff3d6e', 0)); ctx.fillStyle = bg; ctx.fillRect(c.x - hw * 0.7, top.y - 70, hw * 1.4, c.y - top.y + 70); }
    function face(a, b2, dark) {
      var g = ctx.createLinearGradient(0, a.y, 0, a.y + hgt);
      g.addColorStop(0, rgba(col, dark ? 0.22 : 0.34)); g.addColorStop(1, dark ? 'rgba(6,8,22,.96)' : 'rgba(12,16,40,.94)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b2.x, b2.y + hgt); ctx.lineTo(a.x, a.y + hgt); ctx.closePath(); ctx.fill();
      // lit windows (deterministic, a few flicker)
      for (var f = 0; f < b.floors; f++) for (var k = 0; k < 4; k++) {
        var hv = hash(b.gx * 13 + f + (dark ? 50 : 0), b.gy * 7 + k), on = hv > 0.38;
        if (!reduce && hv > 0.93) on = Math.sin(t / 300 + hv * 40) > 0;
        if (!on) continue;
        var u = (k + 0.5) / 4, wx = a.x + (b2.x - a.x) * u, wy = a.y + (b2.y - a.y) * u + f * FLOOR + FLOOR * 0.35;
        ctx.fillStyle = rgba(col, hv > 0.8 ? 0.95 : 0.55); ctx.beginPath(); ctx.moveTo(wx - 2.2, wy - (b2.y - a.y) / 4 * 0.25); ctx.lineTo(wx + 2.2, wy + (b2.y - a.y) / 4 * 0.25); ctx.lineTo(wx + 2.2, wy + 4.5 + (b2.y - a.y) / 4 * 0.25); ctx.lineTo(wx - 2.2, wy + 4.5 - (b2.y - a.y) / 4 * 0.25); ctx.closePath(); ctx.fill();
      }
    }
    if (b.floors <= 2) {
      // holo dome on a low plinth
      var ph = 8; var L = { x: left.x, y: c.y - ph }, R = { x: right.x, y: c.y - ph }, F = { x: c.x, y: c.y + hh - ph };
      ctx.fillStyle = 'rgba(10,14,36,.95)'; ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(F.x, F.y); ctx.lineTo(R.x, R.y); ctx.lineTo(R.x, R.y + ph); ctx.lineTo(F.x, F.y + ph); ctx.lineTo(L.x, L.y + ph); ctx.closePath(); ctx.fill();
      var dy = c.y - ph, rx = hw * 0.85, ry = hh * 0.85, dh = 14 + b.floors * 7;
      var dg = ctx.createRadialGradient(c.x - 4, dy - dh * 0.7, 1, c.x, dy - dh * 0.4, rx * 1.2); dg.addColorStop(0, rgba(col, 0.45)); dg.addColorStop(1, rgba(col, 0.06));
      ctx.fillStyle = dg; ctx.beginPath(); ctx.ellipse(c.x, dy, rx, dh, 0, Math.PI, 0); ctx.ellipse(c.x, dy, rx, ry, 0, 0, Math.PI); ctx.fill();
      ctx.save(); ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = sel ? 1.8 : 1.1; ctx.shadowColor = col; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.ellipse(c.x, dy, rx, dh, 0, Math.PI, 0); ctx.stroke();
      [0.55, 0.15].forEach(function (f) { ctx.beginPath(); ctx.ellipse(c.x, dy, rx * f, dh, 0, Math.PI, 0); ctx.stroke(); });
      ctx.beginPath(); ctx.ellipse(c.x, dy - dh * 0.45, rx * 0.89, ry * 0.5, 0, 0, Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(c.x, dy, rx, ry, 0, 0, Math.PI); ctx.stroke(); ctx.restore();
      top = { x: c.x, y: dy - dh };
    } else {
      face(left, front, false); face(front, right, true);
      ctx.fillStyle = rgba(col, 0.3); ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); ctx.lineTo(front.x, front.y); ctx.lineTo(left.x, left.y); ctx.closePath(); ctx.fill();
      // neon edges
      ctx.save(); ctx.strokeStyle = sel ? '#ffffff' : col; ctx.lineWidth = sel ? 2 : 1.2; ctx.shadowColor = col; ctx.shadowBlur = sel ? 16 : 9;
      ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); ctx.lineTo(front.x, front.y); ctx.lineTo(left.x, left.y); ctx.closePath();
      ctx.moveTo(left.x, left.y); ctx.lineTo(left.x, left.y + hgt); ctx.lineTo(front.x, front.y + hgt); ctx.lineTo(right.x, right.y + hgt); ctx.lineTo(right.x, right.y);
      ctx.moveTo(front.x, front.y); ctx.lineTo(front.x, front.y + hgt); ctx.stroke(); ctx.restore();
      // antenna + beacon on towers
      if (b.floors >= 4) {
        var ay = (top.y + front.y) / 2;
        ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(c.x, ay); ctx.lineTo(c.x, ay - 16); ctx.stroke();
        var blink = reduce ? 1 : (Math.sin(t / 380 + b.gx * 2) > 0.2 ? 1 : 0.25);
        ctx.fillStyle = rgba('#ff3dbb', blink); ctx.shadowColor = '#ff3dbb'; ctx.shadowBlur = 10 * blink; ctx.beginPath(); ctx.arc(c.x, ay - 17, 2.2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        top = { x: c.x, y: ay - 18 };
      }
    }
    if (b.category === 'spreadsheet') { var sy = b.floors <= 2 ? c.y - 4 : front.y + 6; ctx.strokeStyle = rgba(col, 0.95); ctx.lineWidth = 1.2; ctx.strokeRect(c.x - 6, sy, 12, 9); ctx.beginPath(); ctx.moveTo(c.x - 6, sy + 4.5); ctx.lineTo(c.x + 6, sy + 4.5); ctx.moveTo(c.x, sy); ctx.lineTo(c.x, sy + 9); ctx.stroke(); }
    if (sel) { var pg = ctx.createLinearGradient(0, top.y, 0, top.y - 120); pg.addColorStop(0, 'rgba(255,255,255,.35)'); pg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = pg; ctx.fillRect(c.x - 1.5, top.y - 120, 3, 120); }
    // floating status marker
    var bob = reduce ? 0 : Math.sin(t / 600 + b.gx) * 2.5, gy0 = top.y - 16 + bob;
    ctx.save(); ctx.shadowColor = sc; ctx.shadowBlur = 12; ctx.strokeStyle = sc; ctx.lineWidth = 1.5; ctx.fillStyle = rgba(sc.charAt(0) === '#' ? sc : '#3dffa8', 0.25);
    ctx.beginPath(); ctx.moveTo(c.x, gy0 - 7); ctx.lineTo(c.x + 5, gy0); ctx.lineTo(c.x, gy0 + 7); ctx.lineTo(c.x - 5, gy0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = sc; ctx.beginPath(); ctx.arc(c.x, gy0, 1.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // name tag: cockpit label
    ctx.font = '600 9.5px ' + css('--mono'); ctx.textAlign = 'center'; if ('letterSpacing' in ctx) ctx.letterSpacing = '1px';
    var label = (b.name.length > 16 ? b.name.slice(0, 15) + '…' : b.name).toUpperCase(), tw = ctx.measureText(label).width + 12;
    ctx.fillStyle = 'rgba(6,8,22,.82)'; ctx.fillRect(c.x - tw / 2, c.y + hh + 3, tw, 14);
    ctx.fillStyle = col; ctx.fillRect(c.x - tw / 2, c.y + hh + 3, 2, 14);
    ctx.fillStyle = '#e8f1ff'; ctx.fillText(label, c.x + 1, c.y + hh + 13.5);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    b._hit = { x: Math.min(left.x, c.x - tw / 2), y: gy0 - 10, w: Math.max(right.x - left.x, tw), h: c.y + hh + 18 - (gy0 - 10) };
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function draw(now) {
    if (!city) return;

      if (d.name === 'Marktplatz') { var fc = iso(d.gx + d.w / 2, d.gy + d.h - 0.6); core(fc.x, fc.y, t); }
      var lp = iso(d.gx, d.gy + d.h);
      ctx.font = '600 10.5px ' + css('--mono'); ctx.textAlign = 'left'; if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
      var dl = (d.name === 'Marktplatz' ? 'Marktplatz · alle' : d.name).toUpperCase();
      // label hangs off the left corner, outward into free space
      ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(61,245,255,.9)'; ctx.fillRect(lp.x - 2, lp.y + 1, 10, 1.5);

      var sd = hash(gx, gy); if (!occupied[gx + ',' + gy] && sd > 0.8) crystal(gx, gy, sd);
    }
    // data-flow light bridges with comet packets
    var byId = {}; city.buildings.forEach(function (b) { byId[b.id] = b; });
    city.roads.forEach(function (r, idx) {
      var A = byId[r.from], B = byId[r.to]; if (!A || !B) return;
      var p1 = iso(A.gx + 0.5, A.gy + 0.5), p2 = iso(B.gx + 0.5, B.gy + 0.5);
      p1 = { x: p1.x, y: p1.y - 20 }; p2 = { x: p2.x, y: p2.y - 20 };
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2 - 70;
      var hot = selected && (selected === r.from || selected === r.to), col = '#3df5ff';
      ctx.save(); ctx.lineCap = 'round';

  }

  // ---- panel -------------------------------------------------------------------------------
  function bar(label, value, color) {
    var v = Math.max(0, Math.min(1, value)), i = el('i'); i.style.width = Math.round(v * 100) + '%'; i.style.background = color;

  function questButton(q) {

  }

        bar('Auslastung', usage, usage < 0.7 ? css('--warn') : css('--accent')),
        bar('Pflege', b.owner ? 1 : 0.15, b.owner ? css('--accent') : css('--bad')),
        bar('Vernetzung', Math.min(1, roads / 2), roads ? css('--accent') : css('--warn')),
        bar('Sicherheit', qs.some(function (q) { return q.kind === 'shadow_it' || q.kind === 'critical_spreadsheet'; }) ? 0.2 : 1, qs.some(function (q) { return q.kind === 'shadow_it' || q.kind === 'critical_spreadsheet'; }) ? css('--bad') : css('--accent'))

        .forEach(function (f) { facts.appendChild(el('dt', null, [f[0]])); facts.appendChild(el('dd', null, [f[1]])); });
      panel.appendChild(facts);

    panel.appendChild(el('h2', null, [city.company]));
    panel.appendChild(el('p', 'sub', ['Klicke ein Gebäude an oder wähle eine Aufgabe.']));
    var tabs = el('div', 'tabs');

      var x = el('button', null, [tb[1]]); x.type = 'button'; x.setAttribute('aria-pressed', String(tab === tb[0]));

      panel.appendChild(el('p', 'sub', ['Höhe = Zahl der Nutzer · Lichtring: grün ok, gelb Hinweis, rot dringend · Lichtbrücken = Datenflüsse · Kuppeln = kleine Programme']));

  // ---- interaction -------------------------------------------------------------------------
