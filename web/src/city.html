<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software-Stadt</title>
<style>
  /* Sims-like isometric town: sky-to-meadow canvas, floating card panel, plumb-bob status gems */
  :root {
    --sky-1:#bfe6ff; --sky-2:#e9f7ff; --grass:#8fd06a; --grass-2:#7cc25a; --lot:#e9e3d3; --lot-edge:#cfc6ad; --road:#9aa3ad;
    --ink:#20302a; --muted:#5c6d66; --card:#ffffff; --card-line:#d9e4dc; --accent:#2f9e57; --warn:#e8a92b; --bad:#e0503f;
    --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sky-1:#1b2b47; --sky-2:#2b3f63; --grass:#3f7a3a; --grass-2:#36692f; --lot:#5b5a52; --lot-edge:#47463f; --road:#5e6670;
            --ink:#eef4ef; --muted:#a9b9b0; --card:#1f2924; --card-line:#33433a; --accent:#5fd18a; --warn:#f0bd55; --bad:#ff7a6a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --sky-1:#1b2b47; --sky-2:#2b3f63; --grass:#3f7a3a; --grass-2:#36692f; --lot:#5b5a52; --lot-edge:#47463f; --road:#5e6670;
            --ink:#eef4ef; --muted:#a9b9b0; --card:#1f2924; --card-line:#33433a; --accent:#5fd18a; --warn:#f0bd55; --bad:#ff7a6a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--sky-2); color:var(--ink); font:14px/1.4 var(--font); }
  .stage { position:relative; width:100%; height:560px; overflow:hidden; border-radius:14px; background:linear-gradient(var(--sky-1), var(--sky-2) 60%); touch-action:none; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  .hud { position:absolute; left:12px; top:12px; right:12px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
  .chip { pointer-events:auto; background:var(--card); border:2px solid var(--card-line); border-radius:999px; padding:5px 12px; font-weight:700; box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .chip small { font-weight:400; color:var(--muted); margin-left:4px; }
  .chip.money { color:var(--accent); }
  .zoom { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
  .zoom button, .tabs button { font:700 16px var(--font); width:36px; height:36px; border-radius:10px; border:2px solid var(--card-line); background:var(--card); color:var(--ink); cursor:pointer; }
  .zoom button:focus-visible, .tabs button:focus-visible, .quest:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .panel { position:absolute; left:12px; bottom:12px; width:min(300px, calc(100% - 72px)); max-height:calc(100% - 70px); overflow:auto; background:var(--card); border:2px solid var(--card-line); border-radius:14px; padding:12px 14px; box-shadow:0 6px 18px rgba(0,0,0,.15); }
  .panel h2 { margin:0 0 2px; font-size:17px; display:flex; align-items:center; gap:8px; }
  .gem { width:12px; height:16px; clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%); background:var(--accent); flex:none; }
  .gem.warn { background:var(--warn); } .gem.bad { background:var(--bad); }
  .sub { color:var(--muted); margin:0 0 10px; font-size:13px; }
  .needs { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; margin-bottom:10px; }
  .needs label { font-size:12px; color:var(--muted); }
  .bar { height:10px; border-radius:6px; background:rgba(0,0,0,.08); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:6px; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; margin-bottom:8px; }
  .facts dt { color:var(--muted); } .facts dd { margin:0; font-variant-numeric:tabular-nums; }
  .quest { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:transparent; border:0; border-left:4px solid var(--warn); padding:6px 8px; margin:6px 0; border-radius:6px; cursor:pointer; }
  .quest.high { border-left-color:var(--bad); } .quest.low { border-left-color:var(--accent); }
  .quest:hover { background:rgba(0,0,0,.04); }
  .quest b { display:block; font-size:13px; }
  .quest span { font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .quest.open span { -webkit-line-clamp:unset; display:block; }
  .quest .save { color:var(--accent); font-weight:700; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs button { width:auto; height:30px; padding:0 10px; font-size:13px; }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .foot { font-size:11px; color:var(--muted); margin-top:8px; }
  .empty { padding:24px; color:var(--muted); }
  @media (max-width: 520px) { .stage { height:720px; } .panel { width:calc(100% - 24px); max-height:40%; } .zoom { bottom:auto; top:130px; } .chip { padding:3px 9px; font-size:13px; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Software-Stadt: Abteilungen als Viertel, Programme als Gebäude"></canvas>
  <div class="hud" id="hud"></div>
  <div class="zoom"><button id="zin" type="button" aria-label="Hineinzoomen">+</button><button id="zout" type="button" aria-label="Herauszoomen">−</button><button id="zfit" type="button" aria-label="Ganze Stadt zeigen">⌂</button></div>
  <div class="panel" id="panel"><div class="empty">Stadt wird gebaut …</div></div>
</div>
<script>
(function () {
  var COLORS = { crm:'#4f8de0', erp:'#7a5bd6', accounting:'#2fa58e', hr:'#e57ab0', communication:'#f0a23a', collaboration:'#3db8d6',
    storage:'#8a9bb0', spreadsheet:'#4caf50', dev:'#5c6bc0', marketing:'#ff7f6e', support:'#f6c343', security:'#556070', analytics:'#9c6ade', ecommerce:'#ef6c8f', other:'#a0a0a0' };
  var LABEL = { crm:'CRM', erp:'ERP', accounting:'Buchhaltung', hr:'Personal', communication:'Kommunikation', collaboration:'Zusammenarbeit', storage:'Dateiablage',
    spreadsheet:'Tabelle', dev:'Entwicklung', marketing:'Marketing', support:'Kundenservice', security:'Sicherheit', analytics:'Auswertung', ecommerce:'Onlineshop', other:'Sonstiges' };
  var TW = 64, TH = 32, FLOOR = 12;
  var stage = document.getElementById('stage'), canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud'), panel = document.getElementById('panel');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var city = null, view = { x: 0, y: 0, s: 1 }, selected = null, tab = 'quests', t0 = performance.now(), dpr = 1;

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function iso(gx, gy) { return { x: (gx - gy) * TW / 2, y: (gx + gy) * TH / 2 }; }
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function c(v) { return Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))); }
    return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
  }
  function hash(a, b) { var h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }
  function el(tag, cls, kids) { var n = document.createElement(tag); if (cls) n.className = cls; (kids || []).forEach(function (k) { if (k != null) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); }); return n; }
  function eur(n) { return Math.round(n || 0).toLocaleString('de-DE') + ' €'; }
  function questsOf(b) { return city.quests.filter(function (q) { return b.questIds.indexOf(q.id) >= 0; }); }
  function mood(b) { var qs = questsOf(b); if (qs.some(function (q) { return q.severity === 'high'; })) return 'bad'; return qs.length ? 'warn' : 'ok'; }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var r = stage.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  function fit() {
    if (!city) return;
    var xs = [], ys = [];
    city.districts.forEach(function (d) { [[d.gx, d.gy], [d.gx + d.w, d.gy], [d.gx, d.gy + d.h], [d.gx + d.w, d.gy + d.h]].forEach(function (p) { var q = iso(p[0], p[1]); xs.push(q.x); ys.push(q.y); }); });
    var minX = Math.min.apply(null, xs) - TW, maxX = Math.max.apply(null, xs) + TW, minY = Math.min.apply(null, ys) - 220, maxY = Math.max.apply(null, ys) + TH * 2;
    var w = canvas.width / dpr, h = canvas.height / dpr, narrow = w <= 640, off = narrow ? 0 : 320;
    // Usable area: right of the panel on wide screens, between the HUD and the panel on phones.
    var top = narrow ? 120 : 40, bottom = narrow ? h * 0.58 : h;
    w -= off;
    view.s = Math.min(1.6, Math.max(0.3, Math.min(w / (maxX - minX), (bottom - top) / (maxY - minY))));
    view.x = off + w / 2 - (minX + maxX) / 2 * view.s;
    view.y = top + (bottom - top) / 2 - (minY + maxY) / 2 * view.s;
  }

  // ---- drawing -----------------------------------------------------------------------------
  function diamond(gx, gy, w, h) {
    var a = iso(gx, gy), b = iso(gx + w, gy), c = iso(gx + w, gy + h), d = iso(gx, gy + h);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
  }
  function tree(gx, gy, seed) {
    var p = iso(gx + 0.5, gy + 0.5), r = 7 + seed * 5;
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a5434'; ctx.fillRect(p.x - 1.5, p.y - 10, 3, 10);
    ctx.fillStyle = seed > 0.5 ? '#3f9a45' : '#56b04c';
    ctx.beginPath(); ctx.arc(p.x, p.y - 12 - r / 2, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(p.x - r / 3, p.y - 14 - r / 2, r / 3, 0, Math.PI * 2); ctx.fill();
  }
  function building(b, t) {
    var color = COLORS[b.category] || COLORS.other, hgt = b.floors * FLOOR;
    var c = iso(b.gx + 0.5, b.gy + 0.5), hw = TW * 0.38, hh = TH * 0.38;
    var top = { x: c.x, y: c.y - hh - hgt }, left = { x: c.x - hw, y: c.y - hgt }, right = { x: c.x + hw, y: c.y - hgt }, front = { x: c.x, y: c.y + hh - hgt };
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(c.x + 8, c.y + 4, hw * 1.15, hh * 1.1, 0, 0, Math.PI * 2); ctx.fill();
    // left wall
    ctx.fillStyle = shade(color, -0.12); ctx.beginPath(); ctx.moveTo(left.x, left.y); ctx.lineTo(front.x, front.y); ctx.lineTo(front.x, front.y + hgt); ctx.lineTo(left.x, left.y + hgt); ctx.closePath(); ctx.fill();
    // right wall
    ctx.fillStyle = shade(color, -0.3); ctx.beginPath(); ctx.moveTo(front.x, front.y); ctx.lineTo(right.x, right.y); ctx.lineTo(right.x, right.y + hgt); ctx.lineTo(front.x, front.y + hgt); ctx.closePath(); ctx.fill();
    // windows (warm light)
    ctx.fillStyle = 'rgba(255,240,180,.85)';
    for (var f = 0; f < b.floors; f++) {
      var fy = f * FLOOR + 4;
      for (var k = 1; k <= 2; k++) {
        var u = k / 3;
        var lx = left.x + (front.x - left.x) * u, ly = left.y + (front.y - left.y) * u + hgt - fy - 6;
        ctx.beginPath(); ctx.moveTo(lx - 3, ly - 1.5); ctx.lineTo(lx + 3, ly + 1.5); ctx.lineTo(lx + 3, ly + 6.5); ctx.lineTo(lx - 3, ly + 3.5); ctx.closePath(); ctx.fill();
        var rx = front.x + (right.x - front.x) * u, ry = front.y + (right.y - front.y) * u + hgt - fy - 6;
        ctx.beginPath(); ctx.moveTo(rx - 3, ry + 1.5); ctx.lineTo(rx + 3, ry - 1.5); ctx.lineTo(rx + 3, ry + 3.5); ctx.lineTo(rx - 3, ry + 6.5); ctx.closePath(); ctx.fill();
      }
    }
    // roof
    ctx.fillStyle = shade(color, 0.25); ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); ctx.lineTo(front.x, front.y); ctx.lineTo(left.x, left.y); ctx.closePath(); ctx.fill();
    if (b.floors <= 2) { // pitched house roof
      var ridge = 14;
      ctx.fillStyle = shade(color, -0.45);
      ctx.beginPath(); ctx.moveTo(front.x, front.y); ctx.lineTo(right.x, right.y); ctx.lineTo((top.x + right.x) / 2, (top.y + right.y) / 2 - ridge); ctx.lineTo((left.x + front.x) / 2, (left.y + front.y) / 2 - ridge); ctx.closePath(); ctx.fill();
      ctx.fillStyle = shade(color, -0.2);
      ctx.beginPath(); ctx.moveTo(left.x, left.y); ctx.lineTo(front.x, front.y); ctx.lineTo((left.x + front.x) / 2, (left.y + front.y) / 2 - ridge); ctx.lineTo((left.x + top.x) / 2, (left.y + top.y) / 2 - ridge); ctx.closePath(); ctx.fill();
      ctx.fillStyle = shade(color, -0.35);
      ctx.beginPath(); ctx.moveTo((left.x + top.x) / 2, (left.y + top.y) / 2 - ridge); ctx.lineTo((left.x + front.x) / 2, (left.y + front.y) / 2 - ridge); ctx.lineTo((top.x + right.x) / 2, (top.y + right.y) / 2 - ridge); ctx.lineTo(top.x, top.y); ctx.closePath(); ctx.fill();
      top = { x: top.x, y: top.y - ridge };
    }
    if (b.category === 'spreadsheet' && b.floors > 2) { // grid roof pattern
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
      for (var g = 1; g < 3; g++) { var s = g / 3; ctx.beginPath(); ctx.moveTo(left.x + (top.x - left.x) * s, left.y + (top.y - left.y) * s); ctx.lineTo(front.x + (right.x - front.x) * s, front.y + (right.y - front.y) * s); ctx.stroke(); }
    }
    if (selected === b.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); ctx.lineTo(right.x, right.y + hgt); ctx.lineTo(front.x, front.y + hgt); ctx.lineTo(left.x, left.y + hgt); ctx.lineTo(left.x, left.y); ctx.closePath(); ctx.stroke(); }
    // plumb-bob gem
    var m = mood(b), gem = m === 'bad' ? css('--bad') : m === 'warn' ? css('--warn') : css('--accent');
    var bob = reduce ? 0 : Math.sin(t / 500 + b.gx) * 3, gy0 = top.y - 26 + bob;
    ctx.fillStyle = gem; ctx.beginPath(); ctx.moveTo(c.x, gy0 - 10); ctx.lineTo(c.x + 7, gy0); ctx.lineTo(c.x, gy0 + 13); ctx.lineTo(c.x - 7, gy0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(c.x, gy0 - 10); ctx.lineTo(c.x + 7, gy0); ctx.lineTo(c.x, gy0 + 1); ctx.closePath(); ctx.fill();
    // name tag
    ctx.font = '700 11px ' + css('--font'); ctx.textAlign = 'center';
    var label = b.name.length > 16 ? b.name.slice(0, 15) + '…' : b.name, tw = ctx.measureText(label).width + 10;
    ctx.fillStyle = 'rgba(255,255,255,.92)'; roundRect(c.x - tw / 2, c.y + hh + 2, tw, 15, 7); ctx.fill();
    ctx.fillStyle = '#20302a'; ctx.fillText(label, c.x, c.y + hh + 13);
    b._hit = { x: Math.min(left.x, c.x - tw / 2), y: gy0 - 12, w: Math.max(right.x - left.x, tw), h: c.y + hh + 18 - (gy0 - 12) };
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function draw(now) {
    if (!city) return;
    var t = now - t0, w = canvas.width, h = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.x, dpr * view.y);
    // meadow
    var maxX = 0, maxY = 0; city.districts.forEach(function (d) { maxX = Math.max(maxX, d.gx + d.w); maxY = Math.max(maxY, d.gy + d.h); });
    ctx.fillStyle = css('--grass'); diamond(-3, -3, maxX + 6, maxY + 6); ctx.fill();
    ctx.strokeStyle = css('--grass-2'); ctx.lineWidth = 1;
    for (var i = -3; i <= maxX + 3; i += 2) { var a = iso(i, -3), b = iso(i, maxY + 3); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    // districts (lots with paths)
    city.districts.forEach(function (d) {
      ctx.fillStyle = css('--lot-edge'); diamond(d.gx, d.gy, d.w, d.h); ctx.fill();
      ctx.fillStyle = css('--lot'); diamond(d.gx + 0.15, d.gy + 0.15, d.w - 0.3, d.h - 0.3); ctx.fill();
      var p = iso(d.gx - 0.6, d.gy + d.h + 0.6);
      ctx.font = '700 13px ' + css('--font'); ctx.textAlign = 'left';
      var label = d.name === 'Marktplatz' ? 'Marktplatz (alle)' : d.name, lw = ctx.measureText(label).width + 14;
      ctx.fillStyle = 'rgba(32,48,42,.82)'; roundRect(p.x - 4, p.y + 6, lw, 20, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(label, p.x + 3, p.y + 20);
    });
    // trees on free meadow tiles
    var occupied = {};
    city.districts.forEach(function (d) { for (var x = d.gx - 1; x <= d.gx + d.w; x++) for (var y = d.gy - 1; y <= d.gy + d.h; y++) occupied[x + ',' + y] = 1; });
    for (var gx = -2; gx < maxX + 2; gx++) for (var gy = -2; gy < maxY + 2; gy++) {
      var s = hash(gx, gy); if (!occupied[gx + ',' + gy] && s > 0.72) tree(gx, gy, s);
    }
    // data-flow roads with moving packets
    var byId = {}; city.buildings.forEach(function (b) { byId[b.id] = b; });
    city.roads.forEach(function (r, idx) {
      var A = byId[r.from], B = byId[r.to]; if (!A || !B) return;
      var p1 = iso(A.gx + 0.5, A.gy + 0.5), p2 = iso(B.gx + 0.5, B.gy + 0.5), mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2 - 40;
      var hot = selected && (selected === r.from || selected === r.to);
      ctx.strokeStyle = hot ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.55)'; ctx.lineWidth = hot ? 3 : 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.quadraticCurveTo(mx, my, p2.x, p2.y); ctx.stroke(); ctx.setLineDash([]);
      var u = reduce ? 0.5 : ((t / 2200 + idx * 0.37) % 1), q = 1 - u;
      var px = q * q * p1.x + 2 * q * u * mx + u * u * p2.x, py = q * q * p1.y + 2 * q * u * my + u * u * p2.y;
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = css('--accent'); ctx.beginPath(); ctx.arc(px, py, 2.4, 0, Math.PI * 2); ctx.fill();
    });
    // buildings back-to-front
    city.buildings.slice().sort(function (a, b) { return (a.gx + a.gy) - (b.gx + b.gy); }).forEach(function (b) { building(b, t); });
    if (!reduce) requestAnimationFrame(draw);
  }

  // ---- panel -------------------------------------------------------------------------------
  function bar(label, value, color) {
    var v = Math.max(0, Math.min(1, value)), i = el('i'); i.style.width = Math.round(v * 100) + '%'; i.style.background = color;
    return [el('label', null, [label]), el('div', 'bar', [i])];
  }
  function questButton(q) {
    var btn = el('button', 'quest ' + q.severity, [el('b', null, [q.title]), el('span', null, [q.detail]), q.savingEurYear ? el('span', 'save', [' · spart ' + eur(q.savingEurYear) + '/Jahr']) : null]);
    btn.type = 'button';
    btn.addEventListener('click', function () { if (q.buildingIds[0]) select(q.buildingIds[0], true); });
    return btn;
  }
  function renderPanel() {
    panel.textContent = '';
    if (selected) {
      var b = city.buildings.filter(function (x) { return x.id === selected; })[0];
      var m = mood(b), qs = questsOf(b), roads = city.roads.filter(function (r) { return r.from === b.id || r.to === b.id; }).length;
      var back = el('button', null, ['← Stadtübersicht']); back.type = 'button'; back.className = 'quest low'; back.style.borderLeftColor = 'transparent';
      back.addEventListener('click', function () { selected = null; renderPanel(); if (reduce) draw(performance.now()); });
      panel.appendChild(back);
      panel.appendChild(el('h2', null, [el('span', 'gem ' + (m === 'ok' ? '' : m)), b.name]));
      panel.appendChild(el('p', 'sub', [(LABEL[b.category] || b.category) + ' · ' + (b.district === 'Marktplatz' ? 'für alle' : b.district)]));
      var usage = b.licenses ? (b.users || 0) / b.licenses : b.users ? 1 : 0.5;
      var needs = el('div', 'needs');
      [].concat(
        bar('Auslastung', usage, usage < 0.7 ? css('--warn') : css('--accent')),
        bar('Pflege', b.owner ? 1 : 0.15, b.owner ? css('--accent') : css('--bad')),
        bar('Vernetzung', Math.min(1, roads / 2), roads ? css('--accent') : css('--warn')),
        bar('Sicherheit', qs.some(function (q) { return q.kind === 'shadow_it' || q.kind === 'critical_spreadsheet'; }) ? 0.2 : 1, qs.some(function (q) { return q.kind === 'shadow_it' || q.kind === 'critical_spreadsheet'; }) ? css('--bad') : css('--accent'))
      ).forEach(function (n) { needs.appendChild(n); });
      panel.appendChild(needs);
      var facts = el('dl', 'facts');
      [['Nutzer', b.users != null ? String(b.users) : '–'], ['Lizenzen', b.licenses != null ? String(b.licenses) : '–'], ['Kosten', b.monthlyCostEur != null ? eur(b.monthlyCostEur) + ' / Monat' : '–'],
       ['Verantwortlich', b.owner || 'niemand'], ['Geschäftskritisch', b.critical ? 'ja' : 'nein'], ['Datenflüsse', String(roads)]]
        .forEach(function (f) { facts.appendChild(el('dt', null, [f[0]])); facts.appendChild(el('dd', null, [f[1]])); });
      panel.appendChild(facts);
      if (qs.length) { panel.appendChild(el('b', null, ['Aufgaben für dieses Gebäude'])); qs.forEach(function (q) { panel.appendChild(questButton(q)); }); }
      else panel.appendChild(el('p', 'sub', ['Alles im grünen Bereich.']));
      return;
    }
    panel.appendChild(el('h2', null, [city.company]));
    panel.appendChild(el('p', 'sub', ['Klicke ein Gebäude an oder wähle eine Aufgabe.']));
    var tabs = el('div', 'tabs');
    [['quests', 'Aufgaben (' + city.quests.length + ')'], ['legend', 'Legende']].forEach(function (tb) {
      var x = el('button', null, [tb[1]]); x.type = 'button'; x.setAttribute('aria-pressed', String(tab === tb[0]));
      x.addEventListener('click', function () { tab = tb[0]; renderPanel(); }); tabs.appendChild(x);
    });
    panel.appendChild(tabs);
    if (tab === 'quests') {
      if (!city.quests.length) panel.appendChild(el('p', 'sub', ['Keine offenen Aufgaben. Saubere Stadt!']));
      city.quests.forEach(function (q) { panel.appendChild(questButton(q)); });
    } else {
      var used = {}; city.buildings.forEach(function (b) { used[b.category] = 1; });
      Object.keys(used).forEach(function (k) { var sw = el('span', 'gem'); sw.style.background = COLORS[k]; sw.style.clipPath = 'none'; sw.style.borderRadius = '3px'; panel.appendChild(el('div', 'needs', [sw, el('span', null, [LABEL[k] || k])])); });
      panel.appendChild(el('p', 'sub', ['Höhe = Zahl der Nutzer · Diamant: grün ok, gelb Hinweis, rot dringend · gestrichelte Wege = Datenflüsse']));
    }
    panel.appendChild(el('div', 'foot', [city.disclaimer]));
  }
  function renderHud() {
    hud.textContent = '';
    var s = city.stats;
    hud.appendChild(el('div', 'chip', [String(s.apps), el('small', null, ['Programme'])]));
    hud.appendChild(el('div', 'chip', [eur(s.monthlyCostEur), el('small', null, ['/ Monat'])]));
    hud.appendChild(el('div', 'chip money', ['§ ' + eur(s.potentialSavingsEurYear), el('small', null, ['Sparpotenzial/Jahr'])]));
    hud.appendChild(el('div', 'chip', ['♥ ' + s.healthScore, el('small', null, ['Stadt-Gesundheit'])]));
  }
  function select(id, center) {
    selected = id; renderPanel();
    if (center) {
      var b = city.buildings.filter(function (x) { return x.id === id; })[0], p = iso(b.gx + 0.5, b.gy + 0.5);
      view.x = canvas.width / dpr / 2 - p.x * view.s; view.y = canvas.height / dpr / 2.4 - p.y * view.s;
    }
    if (reduce) draw(performance.now());
  }

  // ---- interaction -------------------------------------------------------------------------
  var dragging = null, moved = false;
  canvas.addEventListener('pointerdown', function (e) { dragging = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - dragging.x, dy = e.clientY - dragging.y; if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    view.x = dragging.vx + dx; view.y = dragging.vy + dy; if (reduce) draw(performance.now());
  });
  canvas.addEventListener('pointerup', function (e) {
    canvas.classList.remove('drag');
    var wasDrag = moved; dragging = null; if (wasDrag || !city) return;
    var r = canvas.getBoundingClientRect(), wx = (e.clientX - r.left - view.x) / view.s, wy = (e.clientY - r.top - view.y) / view.s;
    var hit = city.buildings.slice().sort(function (a, b) { return (b.gx + b.gy) - (a.gx + a.gy); }).filter(function (b) { var h = b._hit; return h && wx >= h.x && wx <= h.x + h.w && wy >= h.y && wy <= h.y + h.h; })[0];
    if (hit) select(hit.id, false); else if (selected) { selected = null; renderPanel(); if (reduce) draw(performance.now()); }
  });
  function zoom(f, cx, cy) {
    var ns = Math.max(0.3, Math.min(2.5, view.s * f));
    cx = cx == null ? canvas.width / dpr / 2 : cx; cy = cy == null ? canvas.height / dpr / 2 : cy;
    view.x = cx - (cx - view.x) * ns / view.s; view.y = cy - (cy - view.y) * ns / view.s; view.s = ns;
    if (reduce) draw(performance.now());
  }
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); var r = canvas.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  document.getElementById('zin').addEventListener('click', function () { zoom(1.2); });
  document.getElementById('zout').addEventListener('click', function () { zoom(1 / 1.2); });
  document.getElementById('zfit').addEventListener('click', function () { fit(); if (reduce) draw(performance.now()); });
  window.addEventListener('resize', function () { resize(); fit(); if (reduce) draw(performance.now()); });

  function start(data) {
    if (!data || !Array.isArray(data.buildings)) return;
    var first = !city; city = data; resize(); fit(); renderHud(); renderPanel();
    if (first || reduce) requestAnimationFrame(draw);
    reportSize();
  }

  // ---- MCP Apps bridge ----------------------------------------------------------------------
  function send(m) { window.parent.postMessage(Object.assign({ jsonrpc: '2.0' }, m), '*'); }
  function reportSize() { send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.documentElement.scrollHeight) } }); }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var m = e.data; if (!m || m.jsonrpc !== '2.0') return;
    if (m.id === 1 && m.result) send({ method: 'ui/notifications/initialized', params: {} });
    if (m.method === 'ui/notifications/tool-result') start(m.params && m.params.structuredContent);
  });
  send({ id: 1, method: 'ui/initialize', params: { appInfo: { name: 'software-stadt', version: '0.1.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' } });
  if (window.openai && window.openai.toolOutput) start(window.openai.toolOutput);
  window.addEventListener('openai:set_globals', function () { if (window.openai && window.openai.toolOutput) start(window.openai.toolOutput); });
  window.__startCity = function (d) { selected = null; tab = 'quests'; start(d); fit(); if (reduce) draw(performance.now()); };
  if (window.__CITY__) start(window.__CITY__);
})();
</script>
