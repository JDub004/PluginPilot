<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software-Stadt</title>
<style>
  /* Holo-City: a night town floating on a light grid. Neon edges, glass prisms, cockpit typography. Always dark by design. */
  :root {
    --bg:#060816; --bg-2:#120b30; --panel:rgba(10,14,36,.78); --line:rgba(120,200,255,.22); --line-2:rgba(120,200,255,.5);
    --ink:#e8f1ff; --muted:#8c99c4; --cyan:#3df5ff; --mag:#ff3dbb; --accent:#3dffa8; --warn:#ffb020; --bad:#ff3d6e;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --font: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--font); }
  .stage { position:relative; width:100%; height:560px; overflow:hidden; border-radius:4px; background:radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%); touch-action:none; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  .glass { background:var(--panel); border:1px solid var(--line); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .hud { position:absolute; left:12px; top:12px; right:12px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
  .chip { pointer-events:auto; padding:6px 12px 6px 14px; display:flex; flex-direction:column; min-width:96px; box-shadow:inset 2px 0 0 var(--cyan);
          clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); }
  .chip b { font:600 17px/1.1 var(--mono); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .chip small { font:500 9.5px/1.2 var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.14em; margin-top:3px; }
  .chip.money { box-shadow:inset 2px 0 0 var(--accent); } .chip.money b { color:var(--accent); text-shadow:0 0 12px rgba(61,255,168,.45); }
  .chip.health { box-shadow:inset 2px 0 0 var(--mag); }
  .zoom { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
  .zoom button { font:600 16px var(--mono); width:36px; height:36px; color:var(--cyan); cursor:pointer; border-radius:2px; }
  .zoom button:hover, .tabs button:hover { border-color:var(--line-2); }
  .zoom button:focus-visible, .tabs button:focus-visible, .quest:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .panel { position:absolute; left:12px; bottom:12px; width:min(300px, calc(100% - 72px)); max-height:calc(100% - 84px); overflow:auto; padding:14px 16px; border-radius:2px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  /* corner brackets that stay put while the panel scrolls */
  .panel { background-image:linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan));
           background-size:14px 1.5px,1.5px 14px,14px 1.5px,1.5px 14px; background-position:0 0,0 0,100% 100%,100% 100%; background-repeat:no-repeat; }
  .kicker { font:500 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); margin:0 0 4px; }
  .panel h2 { margin:0 0 2px; font:600 18px/1.2 var(--font); letter-spacing:.01em; display:flex; align-items:center; gap:8px; }
  .gem { width:10px; height:10px; transform:rotate(45deg); background:var(--accent); box-shadow:0 0 10px var(--accent); flex:none; }
  .gem.warn { background:var(--warn); box-shadow:0 0 10px var(--warn); } .gem.bad { background:var(--bad); box-shadow:0 0 10px var(--bad); }
  .sub { color:var(--muted); margin:0 0 12px; font-size:12.5px; }
  .needs { display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; margin-bottom:12px; }
  .needs label, .needs > span { font:500 10px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
  .bar { height:6px; background:rgba(120,200,255,.1); overflow:hidden; }
  .bar i { display:block; height:100%; -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px); mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px); }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12.5px; margin:0 0 10px; padding:8px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .facts dt { color:var(--muted); font:500 10px/1.9 var(--mono); text-transform:uppercase; letter-spacing:.1em; } .facts dd { margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .section { display:block; font:500 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:6px 0 2px; }
  .quest { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:rgba(120,200,255,.04); border:0; border-left:2px solid var(--warn); padding:7px 10px; margin:6px 0; cursor:pointer; }
  .quest.high { border-left-color:var(--bad); } .quest.low { border-left-color:var(--accent); }
  .quest:hover { background:rgba(120,200,255,.1); }
  .quest b { display:block; font-size:13px; font-weight:600; }
  .quest span { font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .quest .save { color:var(--accent); font:600 11px var(--mono); letter-spacing:.04em; }
  .back { border-left-color:transparent !important; background:transparent; font:500 10px var(--mono) !important; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan) !important; padding-left:0 !important; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tabs button { background:transparent; border:1px solid var(--line); height:28px; padding:0 10px; font:500 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink); cursor:pointer; border-radius:2px; }
  .tabs button[aria-pressed="true"] { background:var(--cyan); color:#04121a; border-color:var(--cyan); box-shadow:0 0 14px rgba(61,245,255,.35); }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  .pill { background:rgba(120,200,255,.06); border:1px solid var(--line); color:var(--ink); font:500 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; padding:6px 9px; cursor:pointer; border-radius:2px; }
  select.pill { background:rgba(6,8,22,.9); color:var(--ink); max-width:100%; }
  select.pill option { background:#0a0e24; color:#e8f1ff; }
  .pill:hover { border-color:var(--cyan); color:var(--cyan); }
  .pill.on { border-color:var(--mag); color:var(--mag); box-shadow:0 0 12px rgba(255,61,187,.3); }
  .person { border-left-color:var(--cyan); } .partner { border-left-color:var(--mag); }
  .facts a { color:var(--cyan); text-decoration:none; } .facts a:hover { text-decoration:underline; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .draft { margin:4px 0 10px; }
  .draft textarea { width:100%; font:12px/1.45 var(--mono); color:var(--ink); background:rgba(6,8,22,.8); border:1px solid var(--line); padding:8px; resize:vertical; }
  .draft .row { margin:6px 0 0; }
  .act { margin:-2px 0 8px 12px; }
  .act .pill { font-size:9.5px; padding:4px 8px; }
  .due { display:flex; justify-content:space-between; gap:8px; font:12px var(--mono); padding:5px 0; border-bottom:1px solid var(--line); }
  .due b { font-weight:600; } .due .hot { color:var(--bad); } .due .soon { color:var(--warn); }
  .chip.brand { box-shadow:inset 3px 0 0 var(--brand, var(--cyan)); flex-direction:row; align-items:center; gap:10px; }
  .chip.brand > div { display:flex; flex-direction:column; }
  .mono { width:30px; height:30px; display:grid; place-items:center; font:700 12px var(--mono); color:#04121a; background:var(--brand, var(--cyan)); border-radius:2px; flex:none; }
  .table { background:rgba(10,14,36,.97) !important; position:absolute; left:324px; right:60px; top:84px; bottom:12px; overflow:auto; padding:12px 14px; z-index:2; scrollbar-width:thin; }
  .table[hidden] { display:none; }
  .table table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .table th { text-align:left; font:500 9.5px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line-2); position:sticky; top:0; background:rgba(10,14,36,.97); }
  .table td { padding:7px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .table tr { cursor:pointer; } .table tbody tr:hover td { background:rgba(120,200,255,.06); }
  .table tr.sel td { background:rgba(61,245,255,.1); }
  .table .num { text-align:right; font-family:var(--mono); }
  .amp { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  .sum { display:flex; flex-wrap:wrap; gap:18px; margin:0 0 10px; font-size:13px; }
  .sum b { font:600 18px var(--mono); display:block; }
  .foot { font-size:10.5px; color:var(--muted); margin-top:10px; opacity:.8; }
  .empty { padding:24px; color:var(--muted); font:500 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; }
  @media (max-width: 640px) { .table { left:12px; right:12px; top:12px; bottom:calc(40% + 20px); z-index:3; } }
  @media (max-width: 520px) { .stage { height:720px; } .panel { width:calc(100% - 24px); max-height:40%; } .zoom { bottom:auto; top:140px; } .chip { min-width:0; padding:4px 10px; } .chip b { font-size:14px; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Software-Stadt: Abteilungen als Viertel, Programme als Gebäude"></canvas>
  <div class="hud" id="hud"></div>
  <div class="zoom"><button class="glass" id="zin" type="button" aria-label="Hineinzoomen">+</button><button class="glass" id="zout" type="button" aria-label="Herauszoomen">−</button><button class="glass" id="zfit" type="button" aria-label="Ganze Stadt zeigen">⌂</button><button class="glass" id="ztab" type="button" aria-label="Tabellenansicht" title="Nüchterne Tabellenansicht" aria-pressed="false">☰</button><button class="glass" id="znet" type="button" aria-label="Netzwerk und Standorte" title="Netzwerk und Standorte" hidden>◎</button></div>
  <div class="table glass" id="table" hidden></div>
  <div class="panel glass" id="panel"><div class="empty">Stadt wird gebaut …</div></div>
</div>
<script>

    spreadsheet:'#7dff6a', dev:'#6f7dff', marketing:'#ff7a59', support:'#ffe14d', security:'#b8c4ff', analytics:'#c77dff', ecommerce:'#ff4f8b', other:'#9aa5c8' };
  var LABEL = { crm:'CRM', erp:'ERP', accounting:'Buchhaltung', hr:'Personal', communication:'Kommunikation', collaboration:'Zusammenarbeit', storage:'Dateiablage',

  function mood(b) { var qs = questsOf(b); if (qs.some(function (q) { return q.severity === 'high'; })) return 'bad'; return qs.length ? 'warn' : 'ok'; }

  function resize() {

  function fit() {
    if (!city) return;

      scene().districts.forEach(function (d) { [[d.gx, d.gy], [d.gx + d.w, d.gy], [d.gx, d.gy + d.h], [d.gx + d.w, d.gy + d.h]].forEach(function (p) { var q = iso(p[0], p[1]); xs.push(q.x); ys.push(q.y); }); });

    function chip(cls, value, label) { hud.appendChild(el('div', 'chip glass ' + cls, [el('b', null, [value]), el('small', null, [label])])); }
    if (mode === 'net') {
      var ps = city.partners || [];
      chip('', String((city.sites || []).length || 1), 'Standorte');
      var al = ps.filter(function (p) { return p.kind === 'alliance'; }).length, cu = ps.filter(function (p) { return p.kind === 'customer'; }).length;
      if (al) chip('health', String(al), 'Netzwerkpartner'); if (cu) chip('money', String(cu), 'Kunden');
      chip('', String(ps.length - al - cu), 'weitere Partner'); return;
    }
    if (city.brand) {
      var mono = el('span', 'mono', [city.brand.name.split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase()]);
      var bc = el('div', 'chip glass brand', [mono, el('div', null, [el('b', null, [city.brand.name]), el('small', null, ['erstellt von'])])]);
      if (city.brand.color) bc.style.setProperty('--brand', city.brand.color);
      hud.appendChild(bc);
    }
    if (site) chip('health', site.name, 'Standort · ' + site.buildingIds.length + ' Programme');
    if (s.monthlyCostEur > 0) { chip('', eur(s.monthlyCostEur * 12), 'Software / Jahr'); chip('money', eur(s.potentialSavingsEurYear), 'vermeidbar / Jahr'); }
    else chip('', String(s.apps), 'Programme');
    chip('health', String(urgentCount()), 'Dringende Risiken');
    var dl = deadlineCount(); if (dl) chip('health', String(dl), 'Fristen < 90 Tage');
  }
  function urgentCount() { return city.stats.urgent != null ? city.stats.urgent : city.quests.filter(function (q) { return q.severity === 'high'; }).length; }
  function deadlineCount() { return city.stats.deadlines != null ? city.stats.deadlines : 0; }
  // ---- sober table view (for auditors, CFOs, print) --------------------------------------------
  var tableEl = document.getElementById('table'), tabBtn = document.getElementById('ztab'), tableOn = false;
  function renderTable() {
    tableEl.hidden = !tableOn; tabBtn.setAttribute('aria-pressed', String(tableOn));
    if (!tableOn) return;
    tableEl.textContent = '';
    var s = city.stats, sum = el('div', 'sum');
    [[eur(s.monthlyCostEur * 12), 'Software pro Jahr'], [eur(s.potentialSavingsEurYear), 'davon vermeidbar'], [String(urgentCount()), 'dringende Risiken'], [String(deadlineCount()), 'Fristen < 90 Tage'], [String(city.quests.length), 'offene Aufgaben']]
      .forEach(function (k) { sum.appendChild(el('div', null, [el('b', null, [k[0]]), el('small', 'sub', [k[1]])])); });
    tableEl.appendChild(sum);
    var rank = { bad: 0, warn: 1, ok: 2 }, rows = city.buildings.slice().sort(function (a, b) { return rank[mood(a)] - rank[mood(b)] || (b.monthlyCostEur || 0) - (a.monthlyCostEur || 0); });
    var t = el('table'), head = el('tr');
    ['Programm', 'Abteilung', 'Kosten/Monat', 'Nutzer / Lizenzen', 'Verantwortlich', 'Kündigen bis', 'Aufgaben'].forEach(function (h, i) { var th = el('th', i === 2 || i === 3 || i === 6 ? 'num' : null, [h]); head.appendChild(th); });
    t.appendChild(el('thead', null, [head]));
    var body = el('tbody');
    rows.forEach(function (b) {
      var m = mood(b), dot = el('span', 'amp'); dot.style.background = m === 'bad' ? css('--bad') : m === 'warn' ? css('--warn') : css('--accent');
      dot.setAttribute('aria-label', m === 'bad' ? 'dringend' : m === 'warn' ? 'Hinweis' : 'ok');
      var tr = el('tr', selected === b.id ? 'sel' : null, [el('td', null, [dot, b.name]), el('td', null, [b.district === 'Marktplatz' ? 'alle' : b.district]),
        el('td', 'num', [b.monthlyCostEur != null ? eur(b.monthlyCostEur) : '–']), el('td', 'num', [(b.users != null ? b.users : '–') + ' / ' + (b.licenses != null ? b.licenses : '–')]),
        el('td', null, [b.owner || 'niemand']), el('td', null, [b.noticeDeadline ? deDate(b.noticeDeadline) : '–']), el('td', 'num', [String(b.questIds.length)])]);
      tr.addEventListener('click', function () { selected = b.id; selPerson = null; selPartner = null; renderPanel(); renderTable(); });
      body.appendChild(tr);
    });
    t.appendChild(body); tableEl.appendChild(t);
  }
  tabBtn.addEventListener('click', function () { tableOn = !tableOn; renderTable(); });
  function redraw() { if (reduce) draw(performance.now()); }
  function centerOn(x, y) {
    var W = canvas.width / dpr, H = canvas.height / dpr, narrow = W <= 640;
    view.x = (narrow ? W / 2 : 320 + (W - 320) / 2) - x * view.s;
    view.y = (narrow ? 120 + (H * 0.58 - 120) / 2 : H / 2) - y * view.s;
  }
  function siteOfBuilding(id) {
    var sites = city.sites || [], m = mainSiteIdx();
    if (m >= 0 && sites[m].layout.positions[id]) return m;
    for (var i = 0; i < sites.length; i++) if (sites[i].layout.positions[id]) return i;
    return -1;
  }
  function select(id, center) {
    selected = id; selPerson = null; selPartner = null;
    if (focusD && !scene().buildings.some(function (b) { return b.id === id; })) { focusD = null; fit(); }
    if (mode === 'net' || !scene().buildings.some(function (b) { return b.id === id; })) goCity(siteOfBuilding(id), false);
    renderPanel();
    if (center) { var b = scene().buildings.filter(function (x) { return x.id === id; })[0]; if (b) { var p = iso(b.gx + 0.5, b.gy + 0.5); centerOn(p.x, p.y); } }
    redraw();
  }
  function selectPerson(id, center) {
    selPerson = id; selected = null; selPartner = null;
    var inScene = function () { return walkers(scene()).filter(function (w) { return w.person && w.person.id === id; })[0]; };
    if (mode === 'net' || !inScene()) goCity(mainSiteIdx(), false);
    renderPanel();
    var wk = inScene(); if (center && wk) { placeWalker(wk, performance.now() - t0); var p = iso(wk.gx, wk.gy); centerOn(p.x, p.y - 20); }
    redraw();
  }
  function goCity(i, fresh) {
    var changed = mode !== 'city' || siteIdx !== i;
    if (changed) focusD = null;
    mode = 'city'; siteIdx = i;
    if (fresh) { selected = null; selPerson = null; selPartner = null; tab = 'quests'; }
    if (changed) { flash = performance.now(); fit(); renderHud(); if (reduce) requestAnimationFrame(draw); }
    netBtn.textContent = '◎'; netBtn.setAttribute('aria-label', 'Netzwerk und Standorte');
    renderPanel(); redraw();
  }
  function goNet() {
    mode = 'net'; selected = null; selPerson = null; flash = performance.now(); focusD = null;
    if (netLevel === 'site' && !(city.sites || [])[netSite]) netLevel = 'country';
    netBtn.textContent = '▦'; netBtn.setAttribute('aria-label', 'Zurück zur Stadt');
    fit(); renderHud(); renderPanel(); if (reduce) requestAnimationFrame(draw);
  }

  // ---- interaction -------------------------------------------------------------------------
  var dragging = null, moved = false;
  canvas.addEventListener('pointerdown', function (e) { dragging = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - dragging.x, dy = e.clientY - dragging.y; if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    view.x = dragging.vx + dx; view.y = dragging.vy + dy; if (reduce) draw(performance.now());
  });
  canvas.addEventListener('pointerup', function (e) {
    canvas.classList.remove('drag');
    var wasDrag = moved; dragging = null; if (wasDrag || !city) return;
    var r = canvas.getBoundingClientRect(), wx = (e.clientX - r.left - view.x) / view.s, wy = (e.clientY - r.top - view.y) / view.s;
    if (mode === 'net') {
      var node = net().nodes.filter(function (n) { return Math.hypot(n.x - wx, n.y - wy) < (n.r || 30); })[0];
      if (!node) { if (selPartner) { selPartner = null; renderPanel(); redraw(); } return; }
      if (node.type === 'partner') { selPartner = node.ref.id; selSite = -1; renderPanel(); redraw(); }
      else if (node.type === 'group') setLevel('country');
      else if (node.type === 'home' || netLevel === 'site' || !(city.sites || []).length) goCity(node.i, true);
      else { selSite = node.i; selPartner = null; renderPanel(); redraw(); }
      return;
    }
    var ph = walkers(scene()).filter(function (w) { var h = w.person && w.person._hit; return h && wx >= h.x && wx <= h.x + h.w && wy >= h.y && wy <= h.y + h.h; })[0];
    if (ph) { selectPerson(ph.person.id, false); return; }
    var hit = scene().buildings.slice().sort(function (a, b) { return (b.gx + b.gy) - (a.gx + a.gy); }).filter(function (b) { var h = b._hit; return h && wx >= h.x && wx <= h.x + h.w && wy >= h.y && wy <= h.y + h.h; })[0];
    if (hit) select(hit.id, false); else if (selected || selPerson || selPartner) { selected = null; selPerson = null; selPartner = null; renderPanel(); redraw(); }
  });
  function setLevel(lv, site) {
    netLevel = lv; if (site != null) netSite = site; selPartner = null; if (lv !== 'country') selSite = -1;
    flash = performance.now(); fit(); renderHud(); renderPanel(); if (reduce) requestAnimationFrame(draw);
  }
  var outTicks = 0;
  function zoomOutLevel() {
    if (mode === 'city') { if (focusD) { focusD = null; flash = performance.now(); fit(); renderPanel(); return true; } if ((city.sites || []).length || (city.partners || []).length) { goNet(); return true; } return false; }
    if (netLevel === 'site') { setLevel('country'); return true; }
    if (netLevel === 'country' && levels().world) { setLevel('world'); return true; }
    return false;
  }
  function zoom(f, cx, cy) {
    if (f < 1 && view.s <= 0.31) { if (++outTicks >= 3) { outTicks = 0; zoomOutLevel(); } return; }
    outTicks = 0;
    var ns = Math.max(0.3, Math.min(2.5, view.s * f));
    cx = cx == null ? canvas.width / dpr / 2 : cx; cy = cy == null ? canvas.height / dpr / 2 : cy;
    view.x = cx - (cx - view.x) * ns / view.s; view.y = cy - (cy - view.y) * ns / view.s; view.s = ns;
    if (reduce) draw(performance.now());
  }
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); var r = canvas.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  document.getElementById('zin').addEventListener('click', function () { zoom(1.2); });
  document.getElementById('zout').addEventListener('click', function () { zoom(1 / 1.2); });
  document.getElementById('zfit').addEventListener('click', function () { fit(); if (reduce) draw(performance.now()); });
  netBtn.addEventListener('click', function () { if (mode === 'net') goCity(siteIdx, false); else goNet(); });
  window.addEventListener('resize', function () { resize(); fit(); if (reduce) draw(performance.now()); });

  function start(data) {
    if (!data || !Array.isArray(data.buildings)) return;
    var first = !city; city = data; scenes = {}; mode = 'city'; netLevel = 'country'; netSite = -1; selSite = -1; focusD = null; siteIdx = mainSiteIdx(); selPerson = null; selPartner = null;
    netBtn.hidden = !((city.sites || []).length || (city.partners || []).length);
    resize(); fit(); renderHud(); renderPanel(); renderTable();
    if (first || reduce) requestAnimationFrame(draw);
    reportSize();
  }

  // ---- MCP Apps bridge ----------------------------------------------------------------------
  function send(m) { window.parent.postMessage(Object.assign({ jsonrpc: '2.0' }, m), '*'); }
  function reportSize() { send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.documentElement.scrollHeight) } }); }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var m = e.data; if (!m || m.jsonrpc !== '2.0') return;
    if (m.id === 1 && m.result) send({ method: 'ui/notifications/initialized', params: {} });
    if (m.method === 'ui/notifications/tool-result') start(m.params && m.params.structuredContent);
  });
  send({ id: 1, method: 'ui/initialize', params: { appInfo: { name: 'software-stadt', version: '0.1.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' } });
  if (window.openai && window.openai.toolOutput) start(window.openai.toolOutput);
  window.addEventListener('openai:set_globals', function () { if (window.openai && window.openai.toolOutput) start(window.openai.toolOutput); });
  window.__startCity = function (d) { selected = null; tab = 'quests'; start(d); fit(); redraw(); };
  if (window.__CITY__) start(window.__CITY__);
})();
</script>
