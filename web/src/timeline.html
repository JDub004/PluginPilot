<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#fcfbf9; --fg:#2b2a28; --muted:#77736c; --line:#e7e2da; --card:#f5f2ed; --crit:#9a6a1f; --critbg:#fbf4e6; --ok:#4f7a5a; --accent:#6b6f8f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1c1a; --fg:#ebe7e0; --muted:#a39e95; --line:#36332f; --card:#262421; --crit:#e0b26a; --critbg:#2e2719; --ok:#8fbf9a; --accent:#b2b5d4; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:17px; font-weight:500; margin:0 0 6px; }
  .intro { margin:0 0 14px; color:var(--fg); }
  .sub { color:var(--muted); margin:0 0 14px; }
  .next { border-left:3px solid var(--crit); background:var(--critbg); border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  .next b { color:var(--crit); font-weight:600; }
  .phase { margin:20px 0 8px; font-size:13px; color:var(--accent); font-weight:500; }
  ol { list-style:none; margin:0; padding:0 0 0 18px; border-left:2px solid var(--line); }
  li { position:relative; margin:0 0 10px; }
  li::before { content:""; position:absolute; left:-25px; top:12px; width:12px; height:12px; border-radius:50%; background:var(--bg); border:2px solid var(--muted); }
  li.crit::before { border-color:var(--crit); }
  .tag { display:inline-block; margin-left:8px; font-size:11px; color:var(--crit); border:1px solid var(--crit); border-radius:999px; padding:0 7px; vertical-align:1px; font-weight:500; }
  .letter { display:inline-block; margin-top:4px; font-size:12px; color:var(--ok); }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  summary::-webkit-details-marker { display:none; }
  .t { font-weight:500; }
  .due { white-space:nowrap; font-size:12px; color:var(--muted); }
  .due.soon { color:var(--crit); }
  .due.over { color:var(--crit); font-style:italic; }
  .body { margin-top:8px; color:var(--fg); }
  .body p { margin:4px 0; }
  .k { color:var(--muted); }
  .foot { margin-top:16px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  .support { color:var(--fg); font-size:13px; margin-bottom:6px; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<div id="root"><p class="empty">Einen Moment bitte …</p></div>
<script>
(function () {
  var PHASES = { sofort: 'Jetzt als Erstes', erste_woche: 'In den nächsten Tagen', erste_wochen: 'In den kommenden Wochen', spaeter: 'Wenn Sie wieder Kraft haben' };
  var root = document.getElementById('root');

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    (children || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function fmt(d) { var p = String(d).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : String(d); }
  function dueText(s) {
    if (s.overdue) return { cls: 'due over', text: 'vielleicht schon erledigt? (bis ' + fmt(s.dueDate) + ')' };
    if (s.dueDate && typeof s.daysLeft === 'number') {
      var left = s.daysLeft === 0 ? 'heute' : s.daysLeft === 1 ? 'morgen' : 'noch ' + s.daysLeft + ' Tage Zeit';
      return { cls: s.daysLeft <= 7 && s.critical ? 'due soon' : 'due', text: 'bis ' + fmt(s.dueDate) + ' · ' + left };
    }
    return { cls: 'due', text: String(s.dueLabel || '') };
  }

  // All values are rendered as text nodes only (untrusted input).
  function render(plan) {
    if (!plan || !Array.isArray(plan.steps)) return;
    root.textContent = '';
    root.appendChild(el('h1', null, ['Schritt für Schritt – was jetzt zu tun ist']));
    root.appendChild(el('p', { class: 'intro' }, ['Es tut uns sehr leid. Sie müssen nicht alles auf einmal erledigen. Vieles übernimmt auf Wunsch der Bestatter. Hier sehen Sie, was wann wichtig ist.']));
    root.appendChild(el('p', { class: 'sub' }, ['Todestag ' + fmt(plan.dateOfDeath) + ' · Stand ' + fmt(plan.today)]));
    if (plan.nextDeadline) {
      var n = plan.nextDeadline;
      root.appendChild(el('div', { class: 'next' }, [el('b', null, ['Als Nächstes wichtig: ']), n.title + ' – ' + dueText(n).text]));
    }
    Object.keys(PHASES).forEach(function (ph) {
      var steps = plan.steps.filter(function (s) { return s.phase === ph; });
      if (!steps.length) return;
      root.appendChild(el('div', { class: 'phase' }, [PHASES[ph]]));
      var ol = el('ol');
      steps.forEach(function (s) {
        var d = dueText(s);
        var body = el('div', { class: 'body' }, [
          el('p', null, [s.why]),
          el('p', null, [el('span', { class: 'k' }, ['Wo: ']), s.office]),
          s.documents && s.documents.length ? el('p', null, [el('span', { class: 'k' }, ['Unterlagen: ']), s.documents.join(', ')]) : null,
          s.legalBasis ? el('p', null, [el('span', { class: 'k' }, ['Grundlage: ']), s.legalBasis]) : null,
          s.sourceUrl ? el('p', null, [el('span', { class: 'k' }, ['Nachlesen: ']), String(s.sourceUrl).replace(/^https?:\/\/(www\.)?/, '')]) : null,
          s.letterType ? el('span', { class: 'letter' }, ['✉ Einen Brief dafür kann ich Ihnen vorbereiten – fragen Sie einfach.']) : null,
        ]);
        ol.appendChild(el('li', { class: s.critical ? 'crit' : '' }, [
          el('details', null, [el('summary', null, [el('span', { class: 't' }, [s.title, s.critical ? el('span', { class: 'tag' }, ['Frist']) : null]), el('span', { class: d.cls }, [d.text])]), body]),
        ]));
      });
      root.appendChild(ol);
    });
    root.appendChild(el('div', { class: 'foot' }, [el('div', { class: 'support' }, [plan.support]), plan.disclaimer]));
    reportSize();
  }

  // --- MCP Apps bridge (postMessage JSON-RPC with the host) ---------------------------------
  var nextId = 1;
  function send(msg) { window.parent.postMessage(Object.assign({ jsonrpc: '2.0' }, msg), '*'); }
  function reportSize() {
    send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.documentElement.scrollHeight) } });
  }
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var m = event.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id === 1 && m.result) send({ method: 'ui/notifications/initialized', params: {} });
    if (m.method === 'ui/notifications/tool-result') render(m.params && m.params.structuredContent);
  });
  send({ id: nextId++, method: 'ui/initialize', params: { appInfo: { name: 'trauerfall-lotse', version: '0.1.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' } });
  // Legacy ChatGPT fallback.
  if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
  window.addEventListener('openai:set_globals', function () { if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput); });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(reportSize).observe(document.body);
})();
</script>
</body>
</html>
